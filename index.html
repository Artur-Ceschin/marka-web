<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marka: Know what’s growing around you</title>
    <meta
      name="description"
      content="Photograph anything that grows and Marka tells you what it is, then keeps the find in one catalogue that belongs to you. Flowers, fungi and trees, with the confidence of every match shown."
    />

    <!--
      Colours the browser chrome to match the page. Two entries so the first
      paint is right before any JS runs; ThemeProvider rewrites the active one
      when the user toggles, since a manual choice overrides the media query.
    -->
    <meta name="theme-color" content="#F3F1EA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1B2A20" media="(prefers-color-scheme: dark)" />

    <!-- Link previews. og:image must be an absolute URL once a domain exists. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Marka" />
    <meta property="og:title" content="Marka: Know what’s growing around you" />
    <meta
      property="og:description"
      content="Photograph anything that grows and Marka tells you what it is, then keeps the find in one catalogue that belongs to you."
    />
    <meta property="og:image" content="/icons/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Preload only the two weights the type scale uses. `crossorigin` is
      required even for same-origin fonts: without it the preload is fetched in
      a different CORS mode than the CSS request and the file downloads twice.
    -->
    <link rel="preload" href="/fonts/switzer-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/switzer-500.woff2" as="font" type="font/woff2" crossorigin />

    <script>
      // Runs before first paint so the correct theme is on <html> from the
      // start. Without this the page paints light, then React's effect flips it
      // to dark, a visible flash on every load for dark-theme users.
      //
      // Safe to use modern syntax: this only ever runs in a browser that is
      // also about to execute the ES module bundle.
      (() => {
        try {
          const stored = localStorage.getItem('marka-theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme =
            stored === 'light' || stored === 'dark' ? stored : prefersDark ? 'dark' : 'light';

          // Same idea for language: <html lang> must be right before first
          // paint, or a screen reader starts reading with the wrong voice.
          const savedLocale = localStorage.getItem('marka-locale');
          const browserLocale = (navigator.languages || []).find((l) =>
            /^(pt|en)\b/i.test(l),
          );
          document.documentElement.lang =
            savedLocale === 'pt-BR' || savedLocale === 'en'
              ? savedLocale
              : /^pt/i.test(browserLocale || '')
                ? 'pt-BR'
                : 'en';
        } catch {
          // localStorage or matchMedia unavailable: fall back to the default.
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
