# AWS Amplify Hosting build settings.
#
# Kept in the repo rather than in the console so the build is reviewable and
# changes to it travel with the code that needs them.
#
# The build runs the same checks as CI and fails the deploy if any of them
# fail: a red build never reaches the branch's URL.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        # The Amplify image ships several Node versions; this repo needs 24.
        - nvm install 24
        - nvm use 24
        - corepack enable
        - corepack prepare pnpm@9.15.9 --activate
        # Store inside the build directory so the cache block below can keep it.
        - pnpm config set store-dir .pnpm-store
        - pnpm install --frozen-lockfile
    build:
      commands:
        # Repeated from preBuild: each phase can get its own shell, and an
        # `nvm use` there does not always survive into this one, which shows
        # up as "pnpm: command not found" right at the start of the build.
        - nvm use 24
        - corepack enable
        - pnpm verify
        - pnpm build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .pnpm-store/**/*
      - node_modules/**/*
